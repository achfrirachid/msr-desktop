<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<style>
  html,body{margin:0;height:100%;background:rgba(32,72,50,0.97);color:#fff;font-family:sans-serif;
    display:flex;align-items:center;justify-content:center;text-align:center}
  h2{font-weight:normal;font-size:26px;margin:0 0 28px}
  input{width:320px;padding:10px;font-size:22px;background:transparent;color:#fff;border:0;
    border-bottom:2px solid #0d2a1b;text-align:center;direction:ltr;outline:none}
  input::placeholder{color:#b5c7bc}
  button{margin-top:36px;padding:14px 48px;font-size:20px;border:0;border-radius:4px;background:#e0e0e0;color:#111;cursor:pointer}
  #err{color:#ff9d9d;height:22px;margin-top:10px}
</style>
</head>
<body>
<div>
  <h2>أدخل الباسورد لفتح التطبيق</h2>
  <input id="code" type="password" placeholder="الباسورد" autofocus autocomplete="off">
  <br><button id="go">دخول</button>
  <div id="err"></div>
</div>
<script>
  const input = document.getElementById('code');
  const err = document.getElementById('err');
  async function go(){
    const ok = await window.lockApi.unlock(input.value);
    if(!ok){ err.textContent = 'الباسورد غير صحيح'; input.value=''; input.focus(); }
  }
  document.getElementById('go').addEventListener('click', go);
  input.addEventListener('keydown', e => { if(e.key === 'Enter') go(); });
  setTimeout(()=>input.focus(), 100);
</script>
</body>
</html>
