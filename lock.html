<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>مسار - مقفل</title>
<style>
  html,body{margin:0;height:100%;background:#204832;color:#fff;font-family:sans-serif;user-select:none}
  .box{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
  .lock{font-size:64px}
  h2{margin:0}
  input{width:240px;padding:12px;font-size:24px;text-align:center;letter-spacing:2px;border-radius:8px;border:0;direction:ltr}
  button{padding:10px 36px;font-size:16px;border-radius:8px;border:0;cursor:pointer}
  #msg{height:24px;color:#ffb3b3}
  .link{background:none;color:#cfe;text-decoration:underline;font-size:13px;padding:0}
</style>
</head>
<body>
<div class="box">
  <div class="lock">🔒</div>
  <h2 id="title">التطبيق مقفل</h2>
  <input id="p1" type="password" maxlength="20" autocomplete="off" placeholder="••••">
  <input id="p2" type="password" maxlength="20" autocomplete="off" placeholder="عاود الكود" style="display:none">
  <div id="msg"></div>
  <button id="go">دخول</button>
  <button class="link" id="quit">إغلاق التطبيق</button>
</div>
<script>
const $ = (i) => document.getElementById(i);
let setup = false, timer = null;
function msg(t){ $('msg').textContent = t || ''; }
function countdown(ms){
  clearInterval(timer);
  let end = Date.now() + ms;
  $('go').disabled = true;
  timer = setInterval(() => {
    const left = Math.ceil((end - Date.now()) / 1000);
    if (left <= 0) { clearInterval(timer); $('go').disabled = false; msg(''); return; }
    msg('تسنى ' + left + ' ثانية');
  }, 500);
}
async function init(){
  const s = await window.lockApi.state();
  setup = !s.hasPin;
  if (setup) {
    $('title').textContent = 'حدد كود الحماية (حروف أو أرقام، 1 إلى 20)';
    $('p2').style.display = '';
    $('go').textContent = 'حفظ';
  }
  if (s.wait > 0) countdown(s.wait);
  $('p1').focus();
}
async function go(){
  const a = $('p1').value.trim();
  if (setup) {
    if (!/^[A-Za-z0-9]{1,20}$/i.test(a)) return msg('حروف إنجليزية أو أرقام فقط، من 1 إلى 20');
    if (a !== $('p2').value.trim()) return msg('الكودين ماشي بحال بحال');
    const ok = await window.lockApi.setPin(a);
    if (!ok) msg('وقع مشكل، عاود');
    return;
  }
  const r = await window.lockApi.unlock(a);
  $('p1').value = '';
  if (r.ok) return;
  if (r.wait > 0) countdown(r.wait); else msg('الكود غير صحيح');
}
$('go').onclick = go;
$('quit').onclick = () => window.lockApi.quit();
document.addEventListener('keydown', (e) => { if (e.key === 'Enter') go(); });
init();
</script>
</body>
</html>
