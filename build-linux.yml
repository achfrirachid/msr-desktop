name: Build Linux (Zorin / Ubuntu)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'desktop/**'
      - '.github/workflows/build-linux.yml'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare icon (512x512)
        run: |
          if [ -f icon.png ]; then
            convert icon.png -resize 512x512 -background none -gravity center -extent 512x512 desktop/icon.png
          else
            convert -size 512x512 xc:'#103820' desktop/icon.png
          fi

      - name: Install dependencies
        working-directory: desktop
        run: npm install

      - name: Build .deb and AppImage
        working-directory: desktop
        run: npm run dist

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: massar-linux
          path: |
            desktop/dist/*.deb
            desktop/dist/*.AppImage
