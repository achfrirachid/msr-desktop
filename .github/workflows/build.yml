name: Build Massar (Linux)
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Embed secret at build time (from GitHub Secret)
        env:
          TOTP_SECRET: ${{ secrets.TOTP_SECRET }}
        run: node make-seed.js
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: massar-linux
          path: |
            dist/*.deb
            dist/*.AppImage
          retention-days: 30
